<svg width="100%" viewBox="0 0 680 548" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Zwei Arten zu leben — Frankreich und Deutschland im Lebensstil-Vergleich</title>
<desc>Frankreich hat die hoehere Lebenserwartung (83,0 Jahre vs 80,6), raucht aber mehr (34,6% vs 20,9%) und trinkt etwas weniger; Deutschland ist haeufiger uebergewichtig.</desc>
<rect x="0" y="0" width="680" height="548" fill="#F7F4EC"/>
<rect x="0" y="0" width="680" height="4" fill="#C08A1E"/>

<text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#17150F">Zwei Arten zu leben</text>
<text x="41" y="92" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#6B6658">Frankreich raucht mehr, Deutschland ist häufiger übergewichtig —</text>
<text x="41" y="113" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#6B6658">und doch leben die Nachbarn im Schnitt länger.</text>

